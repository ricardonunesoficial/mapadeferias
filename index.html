<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Férias - Redirecionando...</title>
    
    <!-- Meta refresh for automatic redirection (3 seconds) -->
    <meta http-equiv="refresh" content="3; url=https://mapaferias-12a59.firebaseapp.com/">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #4472C4;
            --secondary: #1F4E78;
            --accent: #00B050;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 2rem;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeInScale 0.8s ease-out;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .icon-wrapper {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .redirect-status {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid #334155;
            border-top: 2px solid #60a5fa;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(68, 114, 196, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-3px);
            background: #5981d6;
            box-shadow: 0 20px 25px -5px rgba(68, 114, 196, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Particles background effect */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .footer-note {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="container">
        <div class="glass-card">
            <div class="icon-wrapper">🚀</div>
            <h1>Mapa de Férias Mudou!</h1>
            <p>Estamos numa nova morada para oferecer uma experiência mais rápida e segura.</p>
            
            <div class="redirect-status">
                <div class="loader"></div>
                <span>A redirecionar em <span id="countdown">3</span> segundos...</span>
            </div>
            
            <a href="https://mapaferias-12a59.firebaseapp.com/" class="btn">Ir Agora para o Novo Mapa</a>
        </div>
        
        <p class="footer-note">Auchan & Closer Team • 2026</p>
    </div>

    <script>
        // Automatic redirection script
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        const targetUrl = "https://mapaferias-12a59.firebaseapp.com/";

        const timer = setInterval(() => {
            seconds--;
            if (countdownEl) countdownEl.textContent = seconds;
            
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.replace(targetUrl);
            }
        }, 1000);

        // Fallback immediate redirect if user clicks or interaction happens (optional)
        // But the meta refresh and JS above are standard enough.
    </script>
</body>
</html>
