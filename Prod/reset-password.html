<!DOCTYPE html>
<html>
<head>
  <title>Redefinir Password</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <style>
    body { font-family: Arial; max-width: 400px; margin: 50px auto; padding: 20px; }
    input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; }
    button { background: #4285f4; color: white; border: none; cursor: pointer; }
    #message { margin-top: 20px; padding: 10px; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .loading { background: #f0f0f0; color: #666; }
  </style>
</head>
<body>
  <h2>🔐 Nova Password</h2>
  <input type="password" id="newPassword" placeholder="Nova password (mín. 6 chars)">
  <button onclick="confirmReset()" id="confirmBtn" disabled>Carregando...</button>
  <div id="message" class="loading">A carregar configuração...</div>

  <script>
    // 🔄 CARREGA firebase-config.json
    async function loadFirebaseConfig() {
      try {
        const response = await fetch('firebase-config.json');
        if (!response.ok) throw new Error('Config não encontrada');
        return await response.json();
      } catch (error) {
        showMessage('❌ Erro ao carregar configuração Firebase: ' + error.message, 'error');
        document.getElementById('confirmBtn').style.display = 'none';
        throw error;
      }
    }

    // Inicialização async
    async function initFirebase() {
      try {
        const firebaseConfig = await loadFirebaseConfig();
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        
        // Validação URL params
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const oobCode = urlParams.get('oobCode');
        
        if (mode !== 'resetPassword' || !oobCode) {
          showMessage('Link inválido. <a href="/">Voltar ao Mapa de Férias</a>', 'error');
          document.getElementById('confirmBtn').style.display = 'none';
          return;
        }

        // Tudo OK - ativa botão
        document.getElementById('confirmBtn').disabled = false;
        document.getElementById('confirmBtn').textContent = 'Confirmar';
        window.auth = auth;  // Global para confirmReset()
        window.oobCode = oobCode;

      } catch (error) {
        console.error('Firebase init error:', error);
      }
    }

    window.confirmReset = function() {
      const password = document.getElementById('newPassword').value;
      if (password.length < 6) {
        showMessage('Password deve ter pelo menos 6 caracteres', 'error');
        return;
      }
      
      const btn = document.getElementById('confirmBtn');
      btn.disabled = true;
      btn.textContent = 'A processar...';
      
      window.auth.confirmPasswordReset(window.oobCode, password)
        .then(() => {
          showMessage('✅ Password alterada com sucesso! Podes fechar esta página.', 'success');
        })
        .catch((error) => {
          showMessage('❌ ' + error.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Confirmar';
        });
    };

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.innerHTML = text;
      msg.className = type;
    }

    // Enter no input
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('newPassword').addEventListener('keypress', e => {
        if (e.key === 'Enter') confirmReset();
      });
      initFirebase();
    });
  </script>
</body>
</html>
